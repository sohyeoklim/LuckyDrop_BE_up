server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://luckydrop-db.cdiqy4q6sf1p.ap-northeast-2.rds.amazonaws.com:3306/lucky_drop
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: false

  jpa:
    database: mysql
    hibernate:
      # 운영 데이터와 미션/티켓 이력이 재배포 때 삭제되지 않도록 스키마를 재생성하지 않는다.
      ddl-auto: update
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        default_batch_fetch_size: 100
    database-platform: org.hibernate.dialect.MySQLDialect

file:
  upload-dir: /home/ubuntu/uploads
